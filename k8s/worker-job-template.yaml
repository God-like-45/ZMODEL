apiVersion: batch/v1
kind: Job
metadata:
  name: zmodel-worker-sample
  namespace: zmodel-jobs
  labels:
    app.kubernetes.io/name: zmodel-worker
    app.kubernetes.io/part-of: zmodel-pilot
    app.kubernetes.io/managed-by: zmodel-control-plane
    zmodel.ai/job-id: "sample-job-001"
    zmodel.ai/job-type: "benchmark"
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zmodel-worker
        zmodel.ai/job-id: "sample-job-001"
    spec:
      restartPolicy: Never
      serviceAccountName: zmodel-worker-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: worker
          image: zmodel-worker:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - zmodel.worker.main
            - --spec-file
            - /etc/zmodel/job-spec.json
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          env:
            - name: ZMODEL_JOB_ID
              value: "sample-job-001"
            - name: LOG_LEVEL
              value: "INFO"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: artifacts-storage
              mountPath: /app/artifacts
      volumes:
        - name: artifacts-storage
          persistentVolumeClaim:
            claimName: zmodel-artifacts-pvc
