apiVersion: v1
kind: Secret
metadata:
  name: zmodel-db-credentials
  namespace: zmodel-jobs
  labels:
    app.kubernetes.io/name: zmodel-db-credentials
    app.kubernetes.io/part-of: zmodel-pilot
type: Opaque
stringData:
  # Replace with actual PostgreSQL connection URL in production or local minikube:
  # Example: postgresql+psycopg://zmodel_user:zmodel_password@postgres.default.svc.cluster.local:5432/zmodel_db
  DATABASE_URL: "postgresql+psycopg://zmodel_user:CHANGEME@postgres:5432/zmodel_db"
