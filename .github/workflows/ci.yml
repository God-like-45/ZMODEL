name: CI / CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-validate:
    name: Build, Lint & Automated Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zmodel_user
          POSTGRES_PASSWORD: zmodel_password
          POSTGRES_DB: zmodel_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python Syntax and Import Sanity Checks
        run: |
          python -m py_compile $(find src/ -name "*.py")
          python -m py_compile $(find tests/ -name "*.py")
          PYTHONPATH=src python -c "from zmodel.api.app import create_app; app = create_app(); print('API successfully initialized:', app.title)"

      - name: Validate Kubernetes Manifests Syntax
        run: |
          python -c "
          import yaml, glob
          manifests = glob.glob('k8s/*.yaml')
          assert len(manifests) >= 6, f'Expected manifests in k8s/, found {len(manifests)}'
          for m in manifests:
              with open(m, 'r') as f:
                  list(yaml.safe_load_all(f))
              print(f'Validated: {m}')
          print(f'All {len(manifests)} Kubernetes manifests successfully validated.')
          "

      - name: Run Alembic Database Migrations against PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://zmodel_user:zmodel_password@localhost:5432/zmodel_db
        run: |
          PYTHONPATH=src alembic upgrade head

      - name: Execute Full Pytest Test Suite
        env:
          DATABASE_URL: postgresql+psycopg://zmodel_user:zmodel_password@localhost:5432/zmodel_db
          PYTHONPATH: src
        run: |
          pytest tests/ -v --durations=10
